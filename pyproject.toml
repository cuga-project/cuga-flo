[project]
name = "cuga-flo"
version = "0.1.0"
description = "CUGA FLO (FLow Oversight) — a process harness for policy-aware, structurally-enforced agent workflows. BPMN control points are governed by CUGA agents; execution runs on a pluggable workflow engine over MCP."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    # The reasoning agent and shared infrastructure. Not on PyPI yet — pinned to a
    # git ref; bump the ref and re-run `cuga-flo patch-host` together (see patches/).
    "cuga",
    # Pinned to what cuga-agent's own uv.lock resolves at the rev above. cuga_supervisor/
    # a2a_protocol.py (which remote_agent.py drives) imports from a2a.compat.v0_3, a shim
    # that only exists from 1.0 on — an older/newer a2a-sdk here makes that import fail,
    # HAS_A2A_SDK silently swallows it to False, and every agent_type: agent0 task fails
    # FlowAgent construction with "a2a-sdk is not installed". Keep aligned with cuga-agent.
    "a2a-sdk[http-server]>=1.0.2,<2.0",
    "fastmcp>=3.2.0",
    "langgraph",
    "langchain-core>=1.2.22",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "typer>=0.15.3",
    "uvicorn",
    "httpx",
    "loguru",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3", "ruff>=0.6"]

[project.scripts]
cuga-flo = "cuga_flo.cli:app"

[tool.uv.sources]
# Pinned to the ref the vendored patches/ are verified against. Bump this and
# re-run `cuga-flo patch-host` together (git apply --3way tolerates most drift).
cuga = { git = "https://github.com/cuga-project/cuga-agent.git", rev = "fbb9f1855894fc42cf5f2262a6878cab0cb2a377" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cuga_flo" = [
    "engine/*.md",
    "adapters/kogito/runtime/*.java",
    "adapters/kogito/runtime/*.template",
    "adapters/kogito/runtime/*.bpmn",
    "adapters/simpn/runtime/requirements.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
