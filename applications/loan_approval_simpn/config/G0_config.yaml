# G0 — legacy workflow (design doc §7): no agentic autonomy at all.
#
# Same BPMN model, same policies-independent demo app, same workflow_engine — only
# tasks:/gateways:/hooks: differ from G1-G3. Used by the scenario runner
# (cuga_flo.scenarios.runner), not by `cuga-flo start` directly.
#
# credit_score is computed by `formula: credit_score_formula` — a deterministic,
# built-in approximation of policies/task-credit_check.md's scoring rubric (see
# src/cuga_flo/adapters/simpn/runtime/formulas.py), run entirely inside the
# Simulation Runtime Service with no LLM and no MCP call at all. This is G0's
# actual "conventional BPMN/BPS behavior" — a real legacy system's crude, rigid
# rule, not the complete absence of one. It will often reach a similar
# credit_score to the LLM-driven G1+ path for a straightforward case, which is
# the right baseline: G0's limits should show up as *inflexibility* under a
# scenario it has no rule for (e.g. a regulatory restriction only a hook can
# catch — see S02), not as an inability to do arithmetic at all.

flow:
  name: "Loan Approval Process (SimPN) — G0 legacy"
  id: "loan_approval_simpn_g0_v1"
  version: "1.0"
  bpmn_file: "BPMNdiagram.bpmn"

workflow_engine:
  type: simpn
  url: http://localhost:8082
  process_id: BPMNdiagram
  callback_host: localhost
  callback_port: 8090

variables:
  credit_score: 0.0
  decision: "undecided"
  manager_informed: false
  applicant_name: ""
  applicant_id: ""
  loan_amount: 0
  credit_history: ""
  income: 0
  employment_years: 0

tasks:
  - id: "Activity_0oydey5"
    mode: native
    formula: "credit_score_formula"

gateways:
  Gateway_09ad5fc:
    mode: native
    flows:
      Flow_0ybszcv:
        condition: "${credit_score} > 0.6"
      Flow_1jgea85:
        condition: "${credit_score} <= 0.6"

action_permissions:
  permitted_actions: []
  prohibited_actions: []

# No hooks: block — G0 has no oversight autonomy.
